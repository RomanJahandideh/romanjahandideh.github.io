<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page Not Found | Roman Jahandideh</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #060504;
    color: #f0ece4;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  body {
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
  }
  .kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #D96535;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(48px, 10vw, 96px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 16px;
  }
  p {
    color: rgba(240, 236, 228, 0.7);
    font-size: 15px;
    line-height: 1.6;
    max-width: 46ch;
    margin: 0 auto 32px;
  }
  a.home-link {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 999px;
    text-decoration: none;
    color: #f0ece4;
    border: 1px solid rgba(240, 236, 228, 0.22);
    font-size: 13px;
    letter-spacing: 0.02em;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  a.home-link:hover {
    background: rgba(240, 236, 228, 0.08);
    border-color: rgba(240, 236, 228, 0.4);
  }
</style>
</head>
<body>
  <div>
    <div class="kicker">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved. Head back to the homepage to explore the work.</p>
    <a class="home-link" href="/">Back to Home</a>
  </div>
</body>
</html>
