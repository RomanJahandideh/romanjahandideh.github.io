<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F8F6F2"/>
  <!-- Grid background (monitor feel) -->
  <g stroke="#1C1917" stroke-width="0.5" stroke-opacity="0.12">
    <line x1="40" y1="150" x2="360" y2="150"/>
    <line x1="40" y1="180" x2="360" y2="180"/>
    <line x1="40" y1="210" x2="360" y2="210"/>
    <line x1="40" y1="240" x2="360" y2="240"/>
    <line x1="100" y1="120" x2="100" y2="270"/>
    <line x1="160" y1="120" x2="160" y2="270"/>
    <line x1="220" y1="120" x2="220" y2="270"/>
    <line x1="280" y1="120" x2="280" y2="270"/>
    <line x1="340" y1="120" x2="340" y2="270"/>
  </g>
  <!-- ECG waveform -->
  <polyline
    points="40,195 80,195 95,195 104,178 112,212 118,148 125,216 134,195 170,195 180,178 188,212 194,148 201,216 210,195 250,195 258,178 266,212 272,148 279,216 288,195 360,195"
    fill="none" stroke="#1C1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Apple Watch outline (simplified) -->
  <rect x="56" y="58" width="26" height="34" rx="7" fill="none" stroke="#1C1917" stroke-width="1.6"/>
  <line x1="60" y1="58" x2="50" y2="50" stroke="#1C1917" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="78" y1="58" x2="88" y2="50" stroke="#1C1917" stroke-width="1" stroke-opacity="0.5"/>
  <!-- BPM label -->
  <text x="110" y="90" font-family="Montserrat,sans-serif" font-size="28" font-weight="700" fill="#1C1917" opacity="0.18">92</text>
  <text x="144" y="72" font-family="Montserrat,sans-serif" font-size="8" font-weight="700" letter-spacing="0.14em" fill="#1C1917" opacity="0.22">BPM</text>
  <!-- Terrain silhouette -->
  <path d="M40 300 Q90 275 140 280 Q190 285 240 265 Q290 245 340 260 L360 300 L40 300 Z" fill="none" stroke="#1C1917" stroke-width="1.4" stroke-opacity="0.4"/>
</svg>
