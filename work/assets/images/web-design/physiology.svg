<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="physBg" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="100%" stop-color="#030805"/>
    </radialGradient>
    <filter id="ecgGlow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="fogBlur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="ecgLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a6a1a" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#2aaa2a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff4444" stop-opacity="1"/>
      <stop offset="80%" stop-color="#ff6622" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2aaa2a" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#physBg)"/>
  <!-- Environmental fog (density driven by heart rate) -->
  <rect x="0" y="280" width="800" height="220" fill="#0a3a0a" opacity="0.25" filter="url(#fogBlur)"/>
  <rect x="0" y="320" width="800" height="180" fill="#062006" opacity="0.4" filter="url(#fogBlur)"/>
  <!-- Terrain silhouette (ecosystem landscape) -->
  <path d="M0 380 Q80 350 140 360 Q200 370 260 340 Q320 310 380 330 Q440 350 500 320 Q560 290 620 305 Q680 320 740 300 Q770 290 800 295 L800 500 L0 500 Z" fill="#0a2a08" opacity="0.7"/>
  <path d="M0 420 Q60 400 120 410 Q180 420 240 400 Q300 380 360 395 Q420 410 480 390 Q540 370 600 385 Q660 400 720 385 Q760 378 800 380 L800 500 L0 500 Z" fill="#071e06" opacity="0.8"/>
  <!-- Vegetation instability indicators -->
  <g fill="#1a4a10" opacity="0.6">
    <ellipse cx="150" cy="378" rx="12" ry="30"/><ellipse cx="155" cy="378" rx="8" ry="28"/>
    <ellipse cx="310" cy="345" rx="10" ry="25"/><ellipse cx="315" cy="345" rx="7" ry="22"/>
    <ellipse cx="470" cy="322" rx="14" ry="32"/><ellipse cx="475" cy="322" rx="9" ry="28"/>
    <ellipse cx="630" cy="308" rx="11" ry="26"/><ellipse cx="625" cy="310" rx="7" ry="24"/>
  </g>
  <!-- Heart rate monitor background grid -->
  <g stroke="#1a4a1a" stroke-width="0.5" stroke-opacity="0.4">
    <line x1="0" y1="160" x2="800" y2="160"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="100" y1="120" x2="100" y2="300"/><line x1="200" y1="120" x2="200" y2="300"/>
    <line x1="300" y1="120" x2="300" y2="300"/><line x1="400" y1="120" x2="400" y2="300"/>
    <line x1="500" y1="120" x2="500" y2="300"/><line x1="600" y1="120" x2="600" y2="300"/>
    <line x1="700" y1="120" x2="700" y2="300"/>
  </g>
  <!-- ECG / heartbeat waveform -->
  <path d="M0 220 L60 220 L80 220 L90 200 L100 240 L110 155 L120 245 L130 220 L160 220 L180 220 L190 200 L200 240 L210 155 L220 245 L230 220 L270 220 L280 200 L290 240 L300 155 L310 245 L320 220 L360 220 L370 200 L380 240 L390 155 L400 245 L410 220 L450 220 L460 200 L470 240 L480 148 L490 248 L500 220 L540 220 L550 200 L560 240 L570 145 L580 248 L590 220 L640 220 L650 200 L660 240 L670 155 L680 245 L690 220 L800 220"
        fill="none" stroke="url(#ecgLine)" stroke-width="2.2" stroke-linecap="round" filter="url(#ecgGlow)"/>
  <!-- BPM readout -->
  <text x="660" y="90" font-family="Montserrat,sans-serif" font-size="32" font-weight="700" fill="#2aaa2a" opacity="0.85">92</text>
  <text x="706" y="72" font-family="Montserrat,sans-serif" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#2aaa2a" opacity="0.6">BPM</text>
  <!-- Apple Watch icon (simplified) -->
  <rect x="40" y="52" width="28" height="36" rx="7" fill="none" stroke="#2aaa2a" stroke-width="1.4" opacity="0.55"/>
  <rect x="45" y="60" width="18" height="20" rx="2" fill="#0a200a" opacity="0.8"/>
  <text x="54" y="74" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="7" fill="#2aaa2a" opacity="0.7">♥</text>
  <line x1="44" y1="52" x2="30" y2="44" stroke="#2aaa2a" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="60" y1="52" x2="74" y2="44" stroke="#2aaa2a" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Regulation zone indicators -->
  <text x="50" y="145" font-family="Montserrat,sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.08em" fill="#2aaa2a" opacity="0.45">ZONE · STRESS ESCALATION</text>
  <!-- Unity label -->
  <text x="400" y="478" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="10" font-weight="600" letter-spacing="0.22em" fill="#2aaa2a" opacity="0.4">PHYSIOLOGY-DRIVEN GAMEPLAY · UNITY · APPLE WATCH · BIOADAPTIVE</text>
</svg>
