<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="liBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#100e08"/>
      <stop offset="100%" stop-color="#040402"/>
    </radialGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#liBg)"/>
  <!-- Spiderweb background (faint) -->
  <g stroke="#c8b888" stroke-opacity="0.1" stroke-width="0.6" fill="none">
    <line x1="400" y1="250" x2="400" y2="40"/><line x1="400" y1="250" x2="577" y2="102"/>
    <line x1="400" y1="250" x2="669" y2="280"/><line x1="400" y1="250" x2="530" y2="432"/>
    <line x1="400" y1="250" x2="270" y2="432"/><line x1="400" y1="250" x2="131" y2="280"/>
    <line x1="400" y1="250" x2="223" y2="102"/>
    <polygon points="400,210 440,218 452,250 440,282 400,290 360,282 348,250 360,218" stroke-opacity="0.14"/>
    <polygon points="400,170 460,188 488,235 488,265 460,312 400,330 340,312 312,265 312,235 340,188" stroke-opacity="0.12"/>
    <polygon points="400,128 480,158 524,220 524,280 480,342 400,372 320,342 276,280 276,220 320,158" stroke-opacity="0.09"/>
  </g>
  <!-- D3 node graph edges -->
  <g stroke="#D96535" stroke-width="1" stroke-opacity="0.3">
    <line x1="400" y1="250" x2="280" y2="160"/><line x1="400" y1="250" x2="520" y2="160"/>
    <line x1="400" y1="250" x2="560" y2="290"/><line x1="400" y1="250" x2="460" y2="370"/>
    <line x1="400" y1="250" x2="340" y2="370"/><line x1="400" y1="250" x2="240" y2="290"/>
    <line x1="280" y1="160" x2="200" y2="100"/><line x1="280" y1="160" x2="180" y2="195"/>
    <line x1="520" y1="160" x2="600" y2="100"/><line x1="520" y1="160" x2="620" y2="195"/>
    <line x1="560" y1="290" x2="650" y2="310"/><line x1="560" y1="290" x2="640" y2="380"/>
    <line x1="240" y1="290" x2="150" y2="310"/><line x1="240" y1="290" x2="160" y2="380"/>
  </g>
  <!-- D3 child nodes (smaller) -->
  <g fill="#D96535" opacity="0.55" filter="url(#nodeGlow)">
    <circle cx="280" cy="160" r="12"/><circle cx="520" cy="160" r="12"/>
    <circle cx="560" cy="290" r="12"/><circle cx="460" cy="370" r="12"/>
    <circle cx="340" cy="370" r="12"/><circle cx="240" cy="290" r="12"/>
    <circle cx="200" cy="100" r="8"/><circle cx="180" cy="195" r="8"/>
    <circle cx="600" cy="100" r="8"/><circle cx="620" cy="195" r="8"/>
    <circle cx="650" cy="310" r="8"/><circle cx="640" cy="380" r="8"/>
    <circle cx="150" cy="310" r="8"/><circle cx="160" cy="380" r="8"/>
  </g>
  <!-- Root node (larger, center) -->
  <circle cx="400" cy="250" r="32" fill="#D96535" opacity="0.15" filter="url(#nodeGlow)"/>
  <circle cx="400" cy="250" r="22" fill="#1a1510" stroke="#D96535" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- R lettermark inside root node -->
  <text x="400" y="257" text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#D96535" opacity="0.9">R</text>
  <!-- Mode labels on child nodes -->
  <text x="280" y="156" text-anchor="middle" dominant-baseline="middle" font-family="Montserrat,sans-serif" font-size="6.5" font-weight="700" fill="#ffffff" opacity="0.8">WORK</text>
  <text x="520" y="156" text-anchor="middle" dominant-baseline="middle" font-family="Montserrat,sans-serif" font-size="5.5" font-weight="700" fill="#ffffff" opacity="0.8">TEACH</text>
  <text x="560" y="290" text-anchor="middle" dominant-baseline="middle" font-family="Montserrat,sans-serif" font-size="5.5" font-weight="700" fill="#ffffff" opacity="0.8">HOME</text>
  <text x="240" y="290" text-anchor="middle" dominant-baseline="middle" font-family="Montserrat,sans-serif" font-size="5" font-weight="700" fill="#ffffff" opacity="0.8">CONT</text>
  <!-- Label -->
  <text x="400" y="478" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="10" font-weight="600" letter-spacing="0.22em" fill="#D96535" opacity="0.4">LIVING INTERFACE SYSTEM · PORTFOLIO · 2025</text>
</svg>
