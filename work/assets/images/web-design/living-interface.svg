<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F8F6F2"/>
  <!-- D3 force graph — edges -->
  <g stroke="#1C1917" stroke-width="1.2" stroke-opacity="0.45">
    <line x1="200" y1="200" x2="140" y2="138"/>
    <line x1="200" y1="200" x2="260" y2="138"/>
    <line x1="200" y1="200" x2="292" y2="210"/>
    <line x1="200" y1="200" x2="248" y2="282"/>
    <line x1="200" y1="200" x2="152" y2="282"/>
    <line x1="200" y1="200" x2="108" y2="210"/>
    <line x1="140" y1="138" x2="100" y2="100"/>
    <line x1="140" y1="138" x2="96" y2="155"/>
    <line x1="260" y1="138" x2="300" y2="100"/>
    <line x1="260" y1="138" x2="304" y2="155"/>
    <line x1="292" y1="210" x2="340" y2="232"/>
    <line x1="108" y1="210" x2="60" y2="232"/>
  </g>
  <!-- Child nodes -->
  <g fill="none" stroke="#1C1917" stroke-width="1.6">
    <circle cx="140" cy="138" r="12"/>
    <circle cx="260" cy="138" r="12"/>
    <circle cx="292" cy="210" r="12"/>
    <circle cx="248" cy="282" r="12"/>
    <circle cx="152" cy="282" r="12"/>
    <circle cx="108" cy="210" r="12"/>
  </g>
  <!-- Leaf nodes -->
  <g fill="#1C1917">
    <circle cx="100" cy="100" r="5"/>
    <circle cx="96" cy="155" r="5"/>
    <circle cx="300" cy="100" r="5"/>
    <circle cx="304" cy="155" r="5"/>
    <circle cx="340" cy="232" r="5"/>
    <circle cx="60" cy="232" r="5"/>
  </g>
  <!-- Root node -->
  <circle cx="200" cy="200" r="26" fill="#F8F6F2" stroke="#1C1917" stroke-width="2.2"/>
  <!-- R lettermark -->
  <text x="200" y="207" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#1C1917">R</text>
</svg>
