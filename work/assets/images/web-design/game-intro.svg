<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F8F6F2"/>
  <!-- Ground -->
  <line x1="40" y1="290" x2="360" y2="290" stroke="#1C1917" stroke-width="2" stroke-linecap="round"/>
  <!-- Platforms -->
  <line x1="70" y1="244" x2="160" y2="244" stroke="#1C1917" stroke-width="2" stroke-linecap="round"/>
  <line x1="190" y1="204" x2="270" y2="204" stroke="#1C1917" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="160" x2="360" y2="160" stroke="#1C1917" stroke-width="2" stroke-linecap="round"/>
  <!-- Player character (pixel-style) — on ground -->
  <rect x="110" y="268" width="12" height="12" fill="none" stroke="#1C1917" stroke-width="1.6"/>
  <rect x="112" y="258" width="8" height="10" fill="none" stroke="#1C1917" stroke-width="1.6"/>
  <rect x="110" y="280" width="4" height="6" fill="none" stroke="#1C1917" stroke-width="1.2"/>
  <rect x="118" y="280" width="4" height="6" fill="none" stroke="#1C1917" stroke-width="1.2"/>
  <!-- Chapter text lines (narrative overlay feel) -->
  <line x1="60" y1="100" x2="240" y2="100" stroke="#1C1917" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="60" y1="114" x2="200" y2="114" stroke="#1C1917" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="60" y1="128" x2="220" y2="128" stroke="#1C1917" stroke-width="1" stroke-opacity="0.18"/>
  <!-- Door/goal marker -->
  <rect x="316" y="132" width="22" height="26" fill="none" stroke="#1C1917" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="334" cy="146" r="2" fill="#1C1917"/>
  <!-- Level counter -->
  <text x="60" y="78" font-family="Montserrat,sans-serif" font-size="10" font-weight="700" letter-spacing="0.15em" fill="#1C1917" opacity="0.35">01 / 12</text>
</svg>
