    <line x1="451" y1="190" x2="510" y2="222" stroke="#D96535" stroke-width="1.4" stroke-opacity="0.5"/>
    <line x1="510" y1="222" x2="510" y2="278" stroke="#D96535" stroke-width="1.2" stroke-opacity="0.4"/>
