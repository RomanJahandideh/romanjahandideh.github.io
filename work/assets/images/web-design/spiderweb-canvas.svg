    <line x1="400" y1="250" x2="130" y2="155"/>
    <line x1="400" y1="250" x2="191" y2="78"/>
    <line x1="400" y1="250" x2="286" y2="33"/>
  </g>
  <!-- Concentric rings - animated feel via opacity gradient -->
