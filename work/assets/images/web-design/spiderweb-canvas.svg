<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="webBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#111008"/>
      <stop offset="100%" stop-color="#040402"/>
    </radialGradient>
    <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D96535" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#D96535" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#D96535" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#webBg)"/>
  <!-- Void glow at center -->
  <circle cx="400" cy="250" r="140" fill="url(#voidGlow)"/>
  <!-- Spokes (12 radial lines) -->
