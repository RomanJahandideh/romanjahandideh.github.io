    <circle cx="476" cy="236" r="2.5"/><circle cx="476" cy="264" r="2.5"/>
    <circle cx="451" cy="310" r="2.5"/><circle cx="400" cy="325" r="2.5"/>
    <circle cx="349" cy="310" r="2.5"/><circle cx="324" cy="264" r="2.5"/>
    <circle cx="324" cy="236" r="2.5"/><circle cx="349" cy="190" r="2.5"/>
