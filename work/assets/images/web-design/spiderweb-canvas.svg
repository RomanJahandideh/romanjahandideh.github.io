  <circle cx="609" cy="78" r="3.5" fill="#D96535" opacity="0.8"/>
  <circle cx="451" cy="190" r="3" fill="#D96535" opacity="0.65"/>
  <circle cx="510" cy="222" r="3" fill="#D96535" opacity="0.55"/>
