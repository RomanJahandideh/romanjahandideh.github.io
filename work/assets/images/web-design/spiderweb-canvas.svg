  <text x="400" y="478" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="10" font-weight="600" letter-spacing="0.22em" fill="#d4c8a8" opacity="0.35">SPIDERWEB CANVAS · PHYSICS · BIOMIMETIC · JS</text>
