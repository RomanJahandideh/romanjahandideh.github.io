    <polygon points="400,210 434,218 443,250 434,282 400,290 366,282 357,250 366,218" stroke-width="0.6" stroke-opacity="0.28"/>
    <polygon points="400,175 451,190 476,236 476,264 451,310 400,325 349,310 324,264 324,236 349,190" stroke-width="0.7" stroke-opacity="0.26"/>
    <polygon points="400,138 468,162 510,222 510,278 468,338 400,362 332,338 290,278 290,222 332,162" stroke-width="0.7" stroke-opacity="0.22"/>
    <polygon points="400,100 485,133 543,208 543,292 485,368 400,400 315,368 257,292 257,208 315,133" stroke-width="0.8" stroke-opacity="0.18"/>
    <polygon points="400,62 502,104 576,193 576,306 502,396 400,438 298,396 224,306 224,193 298,104" stroke-width="0.8" stroke-opacity="0.14"/>
    <polygon points="400,28 518,77 608,179 608,320 518,422 400,474 282,422 192,320 192,179 282,77" stroke-width="0.7" stroke-opacity="0.1"/>
