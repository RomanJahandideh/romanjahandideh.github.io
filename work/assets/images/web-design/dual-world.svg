<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F8F6F2"/>
  <!-- Left world panel -->
  <rect x="40" y="80" width="148" height="240" fill="none" stroke="#1C1917" stroke-width="1.6" rx="4"/>
  <!-- Right world panel -->
  <rect x="212" y="80" width="148" height="240" fill="none" stroke="#1C1917" stroke-width="1.6" rx="4"/>
  <!-- Left world elements (geometric, minimal) -->
  <circle cx="114" cy="140" r="18" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-opacity="0.5"/>
  <rect x="68" y="200" width="40" height="60" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-opacity="0.5"/>
  <rect x="120" y="220" width="30" height="40" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Right world elements (mirrored feel) -->
  <circle cx="286" cy="140" r="18" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-opacity="0.5"/>
  <rect x="232" y="200" width="40" height="60" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-opacity="0.5"/>
  <rect x="284" y="220" width="30" height="40" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Vertical divide line -->
  <line x1="200" y1="60" x2="200" y2="340" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Character spanning both worlds -->
  <rect x="192" y="268" width="16" height="20" fill="none" stroke="#1C1917" stroke-width="1.6"/>
  <circle cx="200" cy="260" r="8" fill="none" stroke="#1C1917" stroke-width="1.6"/>
</svg>
