<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Four transparency levels used in the depth perception experiment</title><desc id="desc">Four transparent blue-green spheres labelled 10 percent, 40 percent, 60 percent, and 90 percent.</desc><defs><radialGradient id="sphere" cx="68%" cy="30%" r="78%"><stop offset="0" stop-color="#e4ffff"/><stop offset=".32" stop-color="#83dce0"/><stop offset=".7" stop-color="#5fa9df"/><stop offset="1" stop-color="#174bd3"/></radialGradient></defs><rect width="1200" height="560" fill="#fff"/><g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#111"><g transform="translate(150 150)"><circle cx="0" cy="0" r="100" fill="url(#sphere)"/><text x="0" y="155" font-size="44">(1)</text><text x="0" y="215" font-size="42">10%</text></g><g transform="translate(450 150)"><circle cx="0" cy="0" r="100" fill="url(#sphere)" opacity=".72"/><text x="0" y="155" font-size="44">(2)</text><text x="0" y="215" font-size="42">40%</text></g><g transform="translate(750 150)"><circle cx="0" cy="0" r="100" fill="url(#sphere)" opacity=".48"/><text x="0" y="155" font-size="44">(3)</text><text x="0" y="215" font-size="42">60%</text></g><g transform="translate(1050 150)"><circle cx="0" cy="0" r="100" fill="url(#sphere)" opacity=".23"/><text x="0" y="155" font-size="44">(4)</text><text x="0" y="215" font-size="42">90%</text></g><text x="600" y="445" font-size="28" letter-spacing="3" fill="#655c54">TRANSPARENCY LEVEL</text><path d="M120 500h960" stroke="#d9d3ca" stroke-width="2"/></g></svg>