<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#191919"/>

  <!-- R stem -->
  <rect x="8" y="8" width="10" height="48" fill="#f0f0f0"/>

  <!-- R bowl: right-half ellipse (flat at x=18, bulge to x=42 at y=24) -->
  <path d="M18,8 A24,16 0 0,1 18,40 Z" fill="#f0f0f0"/>

  <!-- Counter punch-out (inner bowl) -->
  <path d="M21,15 A15,9 0 0,1 21,33 Z" fill="#191919"/>

  <!-- Eye — white ring + dark pupil + specular -->
  <circle cx="34" cy="24" r="7.5" fill="#191919"/>
  <circle cx="34" cy="24" r="5.2" fill="#f0f0f0"/>
  <circle cx="34" cy="24" r="2.9" fill="#191919"/>
  <circle cx="36"  cy="22" r="1.1" fill="#f0f0f0"/>

  <!-- R leg (diagonal, from bottom of bowl to bottom-right) -->
  <path d="M18,40 L50,56 H42 L18,44 Z" fill="#f0f0f0"/>
</svg>
